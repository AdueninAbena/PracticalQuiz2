<!DOCTYPE html>
<html>
<head>
  <title>CEIS273 Practical Quiz 1 - Sunset Scene</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="milo" src="milo.jpg">
      <img id="milk" src="milk.jpg">
    </a-assets>

    <!-- Sunset sky, fixed sun near horizon, and warm lighting -->
    <a-sky color="#f4978e"></a-sky>
    <a-entity position="-7.5 4.2 -26">
      <a-sphere position="0 0 0" radius="2.2" color="#ffd166"></a-sphere>
      <a-sphere position="0 0 -0.2" radius="2.9" color="#ffb5a7" opacity="0.35"></a-sphere>
      <a-sphere position="0 0 -0.4" radius="3.7" color="#f8ad9d" opacity="0.18"></a-sphere>
    </a-entity>
    <a-light type="ambient" color="#ffd6ba" intensity="0.72"></a-light>
    <a-light type="directional" position="-6 5 -10" color="#ff9f68" intensity="0.85"></a-light>

    <!-- Sunset clouds -->
    <a-entity position="4.8 6.0 -23">
      <a-sphere position="0 0 0" radius="1.05" color="#ffe5d9"></a-sphere>
      <a-sphere position="0.85 -0.12 0" radius="0.8" color="#ffd6ba"></a-sphere>
      <a-sphere position="-0.8 -0.12 0" radius="0.75" color="#ffd6ba"></a-sphere>
    </a-entity>

    <a-entity position="-1.5 6.8 -24">
      <a-sphere position="0 0 0" radius="0.95" color="#ffe5d9"></a-sphere>
      <a-sphere position="0.75 -0.1 0" radius="0.72" color="#ffd6ba"></a-sphere>
      <a-sphere position="-0.7 -0.1 0" radius="0.68" color="#ffd6ba"></a-sphere>
    </a-entity>

    <a-entity position="10.5 5.4 -22">
      <a-sphere position="0 0 0" radius="1.0" color="#ffd6ba"></a-sphere>
      <a-sphere position="0.8 -0.12 0" radius="0.75" color="#f8ad9d"></a-sphere>
      <a-sphere position="-0.75 -0.12 0" radius="0.7" color="#f8ad9d"></a-sphere>
    </a-entity>

    <a-entity position="-13.5 5.8 -22">
      <a-sphere position="0 0 0" radius="0.9" color="#ffe5d9"></a-sphere>
      <a-sphere position="0.7 -0.1 0" radius="0.68" color="#ffd6ba"></a-sphere>
      <a-sphere position="-0.65 -0.1 0" radius="0.65" color="#ffd6ba"></a-sphere>
    </a-entity>

    <!-- Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="80" height="80" color="#6b705c"></a-plane>

    <!-- Gentle sunset hills -->
    <a-cylinder position="-10 1.4 -21" radius="9" height="2.8" color="#9d6b84"></a-cylinder>
    <a-cylinder position="6.5 1.7 -22" radius="10.5" height="3.4" color="#845a7a"></a-cylinder>

    <!-- Low garden wall and shrubs -->
    <a-box position="0 0.45 -9.5" width="16" height="0.9" depth="0.3" color="#d8a48f"></a-box>
    <a-box position="0 0.93 -9.5" width="16.2" height="0.06" depth="0.38" color="#b07d62"></a-box>
    <a-sphere position="-5.6 0.6 -8.6" radius="0.85" color="#b56576"></a-sphere>
    <a-sphere position="5.6 0.6 -8.6" radius="0.85" color="#b56576"></a-sphere>

    <!-- Garden pond (left-back) with moving fish -->
    <a-entity position="-3.8 0.01 -5.4">
      <a-cylinder position="0 0.01 0" radius="1.85" height="0.02" color="#5c7cfa"></a-cylinder>
      <a-torus position="0 0.02 0" rotation="90 0 0" radius="1.85" radius-tubular="0.14" color="#b08968"></a-torus>
      <a-cylinder position="0.45 0.025 0.3" radius="0.22" height="0.01" color="#84a98c"></a-cylinder>
      <a-sphere position="0.45 0.045 0.3" radius="0.055" color="#ffcad4"></a-sphere>
      <a-cylinder position="-0.5 0.025 -0.3" radius="0.18" height="0.01" color="#a3b18a"></a-cylinder>

      <!-- Fish 1 (Orange koi circling gently near center) -->
      <a-entity
        position="0 0.025 0"
        animation="property: rotation; to: 0 360 0; dur: 9000; easing: linear; loop: true"
      >
        <a-entity position="0.75 0 0">
          <a-sphere position="0 0 0" scale="1.4 0.5 0.7" radius="0.06" color="#ff7b00"></a-sphere>
          <a-box
            position="-0.09 0 0"
            width="0.06"
            height="0.01"
            depth="0.07"
            color="#ff9e00"
            animation="property: rotation; from: 0 18 0; to: 0 -18 0; dir: alternate; dur: 300; loop: true"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- Fish 2 (Coral-red fish swimming opposite direction) -->
      <a-entity
        position="0 0.025 0"
        rotation="0 140 0"
        animation="property: rotation; to: 0 -220 0; dur: 11500; easing: linear; loop: true"
      >
        <a-entity position="1.05 0 0">
          <a-sphere position="0 0 0" scale="1.35 0.5 0.7" radius="0.055" color="#ff595e"></a-sphere>
          <a-box
            position="-0.08 0 0"
            width="0.055"
            height="0.01"
            depth="0.065"
            color="#ff924c"
            animation="property: rotation; from: 0 -18 0; to: 0 18 0; dir: alternate; dur: 320; loop: true"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- Fish 3 (Golden fish on an inner loop) -->
      <a-entity
        position="0 0.025 0"
        rotation="0 250 0"
        animation="property: rotation; to: 0 610 0; dur: 7500; easing: linear; loop: true"
      >
        <a-entity position="0.45 0 0">
          <a-sphere position="0 0 0" scale="1.3 0.5 0.65" radius="0.048" color="#ffca3a"></a-sphere>
          <a-box
            position="-0.07 0 0"
            width="0.05"
            height="0.01"
            depth="0.055"
            color="#ffd166"
            animation="property: rotation; from: 0 18 0; to: 0 -18 0; dir: alternate; dur: 260; loop: true"
          ></a-box>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Tiered fountain (right-back) -->
    <a-entity position="4.2 0 -5.4">
      <a-torus position="0 0.24 0" rotation="90 0 0" radius="1.35" radius-tubular="0.13" color="#b08968"></a-torus>
      <a-cylinder position="0 0.15 0" radius="1.32" height="0.26" color="#9c8978"></a-cylinder>
      <a-cylinder position="0 0.22 0" radius="1.25" height="0.04" color="#5c7cfa"></a-cylinder>
      <a-cylinder position="0 0.62 0" radius="0.2" height="0.8" color="#a68a6d"></a-cylinder>
      <a-cylinder position="0 1.0 0" radius="0.65" height="0.1" color="#b08968"></a-cylinder>
      <a-cylinder position="0 1.04 0" radius="0.6" height="0.03" color="#6b8afd"></a-cylinder>
      <a-sphere position="0 1.25 0" radius="0.12" color="#cbbba0"></a-sphere>
    </a-entity>

    <!-- Two framing sunset trees -->
    <a-entity position="-6.5 0 -7.2">
      <a-cylinder position="0 1.7 0" radius="0.25" height="3.4" color="#5c4033"></a-cylinder>
      <a-sphere position="0 3.6 0" radius="1.4" color="#8f5d5d"></a-sphere>
      <a-sphere position="0.75 3.3 0.25" radius="1.05" color="#b56576"></a-sphere>
    </a-entity>

    <a-entity position="6.5 0 -7.2">
      <a-cylinder position="0 1.7 0" radius="0.25" height="3.4" color="#5c4033"></a-cylinder>
      <a-sphere position="0 3.6 0" radius="1.4" color="#845a7a"></a-sphere>
      <a-sphere position="-0.75 3.3 0.25" radius="1.05" color="#e56b6f"></a-sphere>
    </a-entity>

    <!-- Moving birds in the sky -->
    <a-entity
      position="-12 6.8 -15"
      animation="property: position; to: 12 7.4 -15; dur: 16000; easing: linear; loop: true"
    >
      <!-- Bird 1 -->
      <a-entity position="0 0 0">
        <a-box
          position="-0.14 0 0"
          width="0.28"
          height="0.025"
          depth="0.07"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 25; to: 0 0 -20; dir: alternate; dur: 450; loop: true"
        ></a-box>
        <a-box
          position="0.14 0 0"
          width="0.28"
          height="0.025"
          depth="0.07"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; dur: 450; loop: true"
        ></a-box>
      </a-entity>

      <!-- Bird 2 -->
      <a-entity position="-0.85 0.3 -0.5">
        <a-box
          position="-0.11 0 0"
          width="0.22"
          height="0.02"
          depth="0.06"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 25; to: 0 0 -20; dir: alternate; dur: 420; loop: true"
        ></a-box>
        <a-box
          position="0.11 0 0"
          width="0.22"
          height="0.02"
          depth="0.06"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; dur: 420; loop: true"
        ></a-box>
      </a-entity>

      <!-- Bird 3 -->
      <a-entity position="-0.8 -0.28 0.5">
        <a-box
          position="-0.12 0 0"
          width="0.24"
          height="0.02"
          depth="0.06"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 25; to: 0 0 -20; dir: alternate; dur: 470; loop: true"
        ></a-box>
        <a-box
          position="0.12 0 0"
          width="0.24"
          height="0.02"
          depth="0.06"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; dur: 470; loop: true"
        ></a-box>
      </a-entity>

      <!-- Bird 4 -->
      <a-entity position="-1.65 0.52 -1.0">
        <a-box
          position="-0.1 0 0"
          width="0.2"
          height="0.02"
          depth="0.05"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 25; to: 0 0 -20; dir: alternate; dur: 400; loop: true"
        ></a-box>
        <a-box
          position="0.1 0 0"
          width="0.2"
          height="0.02"
          depth="0.05"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; dur: 400; loop: true"
        ></a-box>
      </a-entity>

      <!-- Bird 5 -->
      <a-entity position="-1.6 -0.45 0.9">
        <a-box
          position="-0.1 0 0"
          width="0.2"
          height="0.02"
          depth="0.05"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 25; to: 0 0 -20; dir: alternate; dur: 460; loop: true"
        ></a-box>
        <a-box
          position="0.1 0 0"
          width="0.2"
          height="0.02"
          depth="0.05"
          color="#3d2c2e"
          animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; dur: 460; loop: true"
        ></a-box>
      </a-entity>
    </a-entity>

    <!-- Moving butterflies -->
    <a-entity
      position="-1.4 1.15 -2.3"
      animation="property: position; from: -1.55 1.1 -2.4; to: -1.1 1.35 -1.9; dir: alternate; dur: 3600; easing: easeInOutSine; loop: true"
    >
      <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.012" height="0.1" color="#3d2c2e"></a-cylinder>
      <a-box
        position="-0.075 0 0"
        width="0.15"
        height="0.012"
        depth="0.1"
        color="#ffbe0b"
        animation="property: rotation; from: 0 0 36; to: 0 0 -25; dir: alternate; dur: 220; loop: true"
      ></a-box>
      <a-box
        position="0.075 0 0"
        width="0.15"
        height="0.012"
        depth="0.1"
        color="#ffbe0b"
        animation="property: rotation; from: 0 0 -36; to: 0 0 25; dir: alternate; dur: 220; loop: true"
      ></a-box>
    </a-entity>

    <a-entity
      position="1.4 1.25 -2.1"
      animation="property: position; from: 1.5 1.2 -2.2; to: 1.05 1.45 -1.8; dir: alternate; dur: 3900; easing: easeInOutSine; loop: true"
    >
      <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.012" height="0.1" color="#3d2c2e"></a-cylinder>
      <a-box
        position="-0.075 0 0"
        width="0.15"
        height="0.012"
        depth="0.1"
        color="#ff758f"
        animation="property: rotation; from: 0 0 36; to: 0 0 -25; dir: alternate; dur: 210; loop: true"
      ></a-box>
      <a-box
        position="0.075 0 0"
        width="0.15"
        height="0.012"
        depth="0.1"
        color="#ff758f"
        animation="property: rotation; from: 0 0 -36; to: 0 0 25; dir: alternate; dur: 210; loop: true"
      ></a-box>
    </a-entity>

    <!-- Table and required items -->
    <a-entity position="0 0 -1.5">
      <a-cylinder position="0 0.03 0" radius="0.44" height="0.06" color="#6f4518"></a-cylinder>
      <a-cylinder position="0 0.37 0" radius="0.24" height="0.74" color="#7f5539"></a-cylinder>
      <a-cylinder position="0 0.76 0" radius="0.94" height="0.06" color="#b07d62"></a-cylinder>
      <a-box position="0 0.793 -0.02" width="0.9" height="0.006" depth="0.5" color="#eddcd2"></a-box>

      <!-- Ghana Milo Tin -->
      <a-cylinder position="-0.24 0.92 -0.06" rotation="0 20 0" radius="0.088" height="0.25" src="#milo" color="#1b7a3d"></a-cylinder>
      <a-cylinder position="-0.24 1.05 -0.06" radius="0.089" height="0.015" color="#146330"></a-cylinder>

      <!-- Milk Tin -->
      <a-cylinder position="-0.03 0.88 -0.08" rotation="0 -10 0" radius="0.065" height="0.17" src="#milk" color="#f2f2f2"></a-cylinder>
      <a-cylinder position="-0.03 0.966 -0.08" radius="0.065" height="0.005" color="#cccccc"></a-cylinder>

      <!-- Yellow Cup + Coaster -->
      <a-entity position="-0.48 0.79 0.06" rotation="0 -35 0">
        <a-cylinder position="0 0.004 0" radius="0.065" height="0.008" color="#c38e70"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.05" height="0.11" color="#f5b82e"></a-cylinder>
        <a-cylinder position="0 0.065 0" radius="0.043" height="0.105" color="#3b2314"></a-cylinder>
        <a-torus position="-0.052 0.06 0" radius="0.032" radius-tubular="0.008" color="#f5b82e"></a-torus>
      </a-entity>

      <!-- White Cup + Coaster -->
      <a-entity position="0.48 0.79 0.06" rotation="0 35 0">
        <a-cylinder position="0 0.004 0" radius="0.065" height="0.008" color="#c38e70"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.05" height="0.11" color="#f7f7f7"></a-cylinder>
        <a-cylinder position="0 0.065 0" radius="0.043" height="0.105" color="#3b2314"></a-cylinder>
        <a-torus position="0.052 0.06 0" radius="0.032" radius-tubular="0.008" color="#f7f7f7"></a-torus>
      </a-entity>

      <!-- Plate and Fruits -->
      <a-entity position="0.21 0.793 0.03">
        <a-cylinder position="0 0.012 0" radius="0.17" height="0.024" color="#fafafa"></a-cylinder>
        <a-sphere position="-0.03 0.055 0.045" radius="0.042" color="#c92a2a"></a-sphere>
        <a-sphere position="0.01 0.085 -0.01" radius="0.042" color="#d93829"></a-sphere>
        <a-sphere position="-0.075 0.05 -0.02" radius="0.04" color="#f08c00"></a-sphere>
        <a-sphere position="0.055 0.05 0.04" radius="0.04" color="#f59f00"></a-sphere>
        <a-torus position="0.06 0.06 -0.05" rotation="25 -40 15" radius="0.09" radius-tubular="0.016" arc="115" color="#fcc419"></a-torus>
        <a-torus position="0.08 0.055 -0.03" rotation="35 -35 10" radius="0.09" radius-tubular="0.015" arc="110" color="#fab005"></a-torus>
      </a-entity>
    </a-entity>

    <!-- Left Chair -->
    <a-entity position="-0.92 0 -1.35" rotation="0 68 0">
      <a-box position="0 0.43 0" width="0.48" height="0.04" depth="0.46" color="#7f5539"></a-box>
      <a-box position="0 0.465 0.01" width="0.44" height="0.045" depth="0.42" color="#e5989b"></a-box>
      <a-box position="-0.21 0.215 0.2" width="0.04" height="0.43" depth="0.04" color="#582f0e"></a-box>
      <a-box position="0.21 0.215 0.2" width="0.04" height="0.43" depth="0.04" color="#582f0e"></a-box>
      <a-box position="-0.21 0.43 -0.2" rotation="-5 0 0" width="0.04" height="0.86" depth="0.045" color="#582f0e"></a-box>
      <a-box position="0.21 0.43 -0.2" rotation="-5 0 0" width="0.04" height="0.86" depth="0.045" color="#582f0e"></a-box>
      <a-box position="0 0.78 -0.23" rotation="-5 0 0" width="0.46" height="0.14" depth="0.035" color="#7f5539"></a-box>
    </a-entity>

    <!-- Right Chair -->
    <a-entity position="0.92 0 -1.35" rotation="0 -68 0">
      <a-box position="0 0.43 0" width="0.48" height="0.04" depth="0.46" color="#7f5539"></a-box>
      <a-box position="0 0.465 0.01" width="0.44" height="0.045" depth="0.42" color="#e5989b"></a-box>
      <a-box position="-0.21 0.215 0.2" width="0.04" height="0.43" depth="0.04" color="#582f0e"></a-box>
      <a-box position="0.21 0.215 0.2" width="0.04" height="0.43" depth="0.04" color="#582f0e"></a-box>
      <a-box position="-0.21 0.43 -0.2" rotation="-5 0 0" width="0.04" height="0.86" depth="0.045" color="#582f0e"></a-box>
      <a-box position="0.21 0.43 -0.2" rotation="-5 0 0" width="0.04" height="0.86" depth="0.045" color="#582f0e"></a-box>
      <a-box position="0 0.78 -0.23" rotation="-5 0 0" width="0.46" height="0.14" depth="0.035" color="#7f5539"></a-box>
    </a-entity>

    <!-- Camera -->
    <a-entity position="0 1.45 0.35" rotation="-8 0 0">
      <a-camera></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
